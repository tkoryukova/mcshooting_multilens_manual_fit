<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔭 ESE Overlay — RATAN Interactive</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; padding: 20px; color: #2c3e50;
  }
  .container { max-width: 1600px; margin: 0 auto; }
  .header {
    text-align: center; background: rgba(255,255,255,0.95);
    padding: 22px; border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3); margin-bottom: 20px;
  }
  h1 { color: #2c3e50; font-size: 1.7em; margin-bottom: 6px; }
  .subtitle { color: #34495e; font-size: 0.95em; }

  .plot-card {
    background: white; border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    padding: 12px; height: 620px; margin-bottom: 20px;
  }

  .controls {
    background: rgba(255,255,255,0.96); padding: 22px 26px;
    border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-bottom: 20px;
  }
  .controls h2 {
    color: #2c3e50; font-size: 1.15em; margin-bottom: 12px;
    border-bottom: 2px solid #ecf0f1; padding-bottom: 8px;
  }
  .controls h3 {
    color: #34495e; font-size: 0.95em; margin: 16px 0 8px;
    padding-left: 6px; border-left: 3px solid #3498db;
  }

  .checkbox-row {
    display: flex; flex-wrap: wrap; gap: 20px;
    margin-bottom: 16px; padding: 10px 14px;
    background: #f8f9fb; border-radius: 12px;
    border: 1px solid #ecf0f1;
    align-items: center;
  }
  .checkbox-row label {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; color: #2c3e50; font-size: 0.92em;
    cursor: pointer; user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    width: 17px; height: 17px; cursor: pointer;
    accent-color: #e67e22;
  }

  .btn-reset {
    background: #7f8c8d; color: white; border: none;
    padding: 8px 18px; border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: 0.9em;
    box-shadow: 0 3px 10px rgba(127,140,141,0.35);
    transition: transform 0.1s, background 0.15s;
  }
  .btn-reset:hover { transform: translateY(-1px); background: #626f70; }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 22px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .slider-group label {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; color: #2c3e50; margin-bottom: 4px; font-size: 0.85em;
  }
  .slider-group .val {
    background: #3498db; color: white; padding: 2px 8px;
    border-radius: 12px; font-weight: 700; font-size: 0.8em;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%; height: 6px; border-radius: 4px;
    background: #ecf0f1; outline: none; -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 16px; width: 16px;
    border-radius: 50%; background: #3498db; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  input[type="range"]::-moz-range-thumb {
    height: 16px; width: 16px; border: none; border-radius: 50%;
    background: #3498db; cursor: pointer;
  }

  /* Панель Resolution — особый стиль */
  .resolution-panel {
    background: #eef6ff;
    border-radius: 14px;
    padding: 18px 22px;
    margin-top: 8px;
    border: 1px solid #cfe3f5;
  }
  .resolution-panel h3 {
    color: #1f6390;
    border-left-color: #2980b9;
    margin-top: 0;
  }
  .resolution-panel .slider-group .val {
    background: #2980b9;
  }
  .resolution-panel input[type="range"]::-webkit-slider-thumb {
    background: #2980b9;
  }
  .resolution-panel input[type="range"]::-moz-range-thumb {
    background: #2980b9;
  }
  .resolution-hint {
    font-size: 0.8em;
    color: #5d7994;
    margin-top: 12px;
    font-family: 'Consolas', monospace;
  }

  .status {
    margin-top: 14px; padding: 10px 14px; border-radius: 10px;
    background: #f4f6f8; font-size: 0.85em; color: #34495e;
    font-family: 'Consolas', monospace;
  }
  .status.warn { background: #fff4e5; color: #a35b00; }
  .status.error { background: #ffe5e5; color: #a30000; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔭 ESE Overlay — RATAN Interactive</h1>
    <p class="subtitle">
      Manual overlay · 2 lenses · α ∝ ν⁻², σ ∝ ν⁻¹ · без фиттинга<br>
      <small>Данные: sig_RATAN5.csv · sig_RATAN8.csv · sig_RATAN11.csv</small>
    </p>
  </div>

  <div id="plotDiv" class="plot-card"></div>

  <div class="controls">
    <h2>Параметры модели</h2>

    <div class="checkbox-row">
      <label>
        <input type="checkbox" id="showData" checked>
        Показывать данные RATAN
      </label>
      <label>
        <input type="checkbox" id="showModel" checked>
        Показывать модель
      </label>
      <button class="btn-reset" id="resetBtn">⟲ Reset к значениям по умолчанию</button>
    </div>

    <h3>Форма линз</h3>
    <div class="grid" id="gridLenses"></div>

    <h3>Временная эволюция</h3>
    <div class="grid" id="gridTime"></div>

    <h3>Нормировки</h3>
    <div class="grid" id="gridNorm"></div>

    <!-- Панель Resolution -->
    <div class="resolution-panel">
      <h3>Resolution</h3>
      <div class="grid" id="gridResolution"></div>
      <div class="resolution-hint" id="resolutionHint">
        u' бины: 80 · пересчёт: —
      </div>
    </div>

    <div class="status" id="status">Загрузка данных…</div>
  </div>
</div>

<script>
// ============================================================
// КОНСТАНТЫ МОДЕЛИ
// ============================================================
const FILE_PATHS = [
  "sig_RATAN5.csv",
  "sig_RATAN8.csv",
  "sig_RATAN11.csv"
];
const NU_LIST_GHZ = [5.0, 8.0, 11.0];
const NU_REF_GHZ = 8.0;

const T_START = 2015.0;
const T_END   = 2015.65;

const COLORS = ['green', 'blue', 'red'];
const MARKERS = ['circle', 'square', 'triangle-up'];

// Значения по умолчанию
const DEFAULTS = {
  alpha_ref: 1.5,
  alpha2:    2.1,
  t_min1:    2015.1987,
  t_delay:   0.4084,
  mu_eff:    35.4115,
  sigma_ref: 2.7,
  slope:    -0.16,
  a_ratio2:  0.6,
  F0_1:      2.58,
  F0_2:      2.19,
  F0_3:      1.97,
  // Resolution
  u_range_min:       -16,
  u_range_max:        12,
  u_prime_range_min: -16,
  u_prime_range_max:  12,
  draw_num_beta:    8000,
  draw_num_u:        800,
  draw_num_bins:      80
};

let params = { ...DEFAULTS };

// ============================================================
// УТИЛИТЫ
// ============================================================
function linspace(a, b, n) {
  const arr = new Array(n);
  if (n === 1) { arr[0] = a; return arr; }
  const step = (b - a) / (n - 1);
  for (let i = 0; i < n; i++) arr[i] = a + i * step;
  return arr;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussian(rng, sigma) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function interp(x, xp, fp) {
  if (x <= xp[0]) return fp[0];
  if (x >= xp[xp.length - 1]) return fp[fp.length - 1];
  let lo = 0, hi = xp.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (xp[mid] <= x) lo = mid;
    else hi = mid;
  }
  const t = (x - xp[lo]) / (xp[hi] - xp[lo]);
  return fp[lo] * (1 - t) + fp[hi] * t;
}

// ============================================================
// ЯДРО: compute_ese_multi
// ============================================================
function computeEseMulti(lenses, sigmaSource, uRange, uPrimeRange,
                         numBeta, numU, numBins, seed) {
  const u0 = linspace(uRange[0], uRange[1], numU);
  const rng = mulberry32(seed);
  const betaS = new Float64Array(numBeta);
  for (let k = 0; k < numBeta; k++) betaS[k] = gaussian(rng, sigmaSource);

  const N = numBeta * numU;
  const totalDefl = new Float64Array(N);

  for (const lens of lenses) {
    const alphaI = lens.alpha;
    const uOffI = lens.u_offset;
    const aRatioI = lens.a_ratio || 1.0;
    const alphaEff = alphaI / (aRatioI * aRatioI);
    const gaussI = 1.0 / (aRatioI * aRatioI);

    for (let k = 0; k < numBeta; k++) {
      const off = k * numU;
      for (let i = 0; i < numU; i++) {
        const uShift = u0[i] - uOffI;
        const defI = alphaEff * uShift * Math.exp(-gaussI * uShift * uShift);
        totalDefl[off + i] += defI;
      }
    }
  }

  const bins = linspace(uPrimeRange[0], uPrimeRange[1], numBins + 1);
  const binW = bins[1] - bins[0];
  const histLensed   = new Float64Array(numBins);
  const histUnlensed = new Float64Array(numBins);

  for (let k = 0; k < numBeta; k++) {
    const bS = betaS[k];
    const off = k * numU;
    for (let i = 0; i < numU; i++) {
      const upL = u0[i] + totalDefl[off + i] + bS;
      const upU = u0[i] + bS;

      let idxL = Math.floor((upL - bins[0]) / binW);
      if (idxL >= 0 && idxL < numBins) histLensed[idxL]++;

      let idxU = Math.floor((upU - bins[0]) / binW);
      if (idxU >= 0 && idxU < numBins) histUnlensed[idxU]++;
    }
  }

  const norm = numBeta * numU * binW;
  const binCenters = new Array(numBins);
  const intensity  = new Array(numBins);
  for (let i = 0; i < numBins; i++) {
    binCenters[i] = (bins[i] + bins[i + 1]) / 2;
    const hU = histUnlensed[i] / norm;
    const hL = histLensed[i]   / norm;
    intensity[i] = hU > 0 ? hL / hU : 0.0;
  }

  return { binCenters, intensity };
}

// ============================================================
// Кэш Монте-Карло
// ВАЖНО: ключ включает uOffset2Ref (= -mu_eff * t_delay),
// потому что он влияет на форму I_ref(u').
// ============================================================
const eseCache = new Map();

function cacheKey(alpha1Nu, alpha2Nu, sigmaNu, uOffset2Ref) {
  return [
    alpha1Nu.toFixed(5),
    alpha2Nu.toFixed(5),
    sigmaNu.toFixed(5),
    uOffset2Ref.toFixed(5),
    params.a_ratio2.toFixed(5),
    params.u_range_min.toFixed(3),
    params.u_range_max.toFixed(3),
    params.u_prime_range_min.toFixed(3),
    params.u_prime_range_max.toFixed(3),
    params.draw_num_beta,
    params.draw_num_u,
    params.draw_num_bins
  ].join('|');
}

// ============================================================
// МОДЕЛЬ: F(t) для одной частоты
// ============================================================
function modelFForOneFrequency(tArray, nuGhz, tRef) {
  const ratio = nuGhz / NU_REF_GHZ;
  const alphaScale = Math.pow(ratio, -2);
  const sigmaScale = Math.pow(ratio, -1);

  const alpha1Nu = params.alpha_ref * alphaScale;
  const alpha2Nu = params.alpha2 * alphaScale;
  const sigmaNu  = params.sigma_ref * sigmaScale;

  const uOffset1Ref = 0.0;
  const uOffset2Ref = -params.mu_eff * params.t_delay;

  const lensesRef = [
    { alpha: alpha1Nu, u_offset: uOffset1Ref, z: 0.0 },
    { alpha: alpha2Nu, u_offset: uOffset2Ref,
      a_ratio: params.a_ratio2, z: 0.0 }
  ];

  const key = cacheKey(alpha1Nu, alpha2Nu, sigmaNu, uOffset2Ref);
  let cached = eseCache.get(key);
  if (!cached) {
    cached = computeEseMulti(
      lensesRef, sigmaNu,
      [params.u_range_min, params.u_range_max],
      [params.u_prime_range_min, params.u_prime_range_max],
      params.draw_num_beta,
      params.draw_num_u,
      params.draw_num_bins,
      42
    );
    eseCache.set(key, cached);
  }

  const bc = cached.binCenters;
  const cleaned = new Array(cached.intensity.length);
  for (let k = 0; k < cached.intensity.length; k++) {
    cleaned[k] = isNaN(cached.intensity[k]) ? 1.0 : cached.intensity[k];
  }

  const F0 = nuGhz === 5.0 ? params.F0_1
           : nuGhz === 8.0 ? params.F0_2
           : params.F0_3;

  const F = new Array(tArray.length);
  for (let i = 0; i < tArray.length; i++) {
    const uOff1t = params.mu_eff * (tArray[i] - params.t_min1);
    const xInterp = -uOff1t;
    const Iese = interp(xInterp, bc, cleaned);
    const Itrend = 1.0 + params.slope * (tArray[i] - tRef);
    F[i] = F0 * Iese * Itrend;
  }

  return F;
}

// ============================================================
// ЗАГРУЗКА CSV
// ============================================================
let dataCache = null;

async function loadData() {
  const tList = [], FList = [], FErrList = [];

  for (const path of FILE_PATHS) {
    const text = await (await fetch(path)).text();
    const lines = text.trim().split('\n');
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(',');
      if (parts.length < 3) continue;
      const epoch = parseFloat(parts[0]);
      const flux  = parseFloat(parts[1]);
      const err   = parseFloat(parts[2]);
      if (isNaN(epoch) || isNaN(flux)) continue;
      if (epoch < T_START || epoch > T_END) continue;
      rows.push({ epoch, flux, err });
    }
    rows.sort((a, b) => a.epoch - b.epoch);
    tList.push(rows.map(r => r.epoch));
    FList.push(rows.map(r => r.flux));
    FErrList.push(rows.map(r => r.err));
  }

  const allT = tList.flat();
  const tRef = 0.5 * (Math.min(...allT) + Math.max(...allT));

  dataCache = { tList, FList, FErrList, tRef };
  return dataCache;
}

// ============================================================
// ПОСТРОЕНИЕ ГРАФИКА
// ============================================================
function update() {
  if (!dataCache) return;

  const t0 = performance.now();
  const { tList, FList, FErrList, tRef } = dataCache;

  const showData  = document.getElementById('showData').checked;
  const showModel = document.getElementById('showModel').checked;

  const traces = [];

  if (showData) {
    for (let i = 0; i < 3; i++) {
      traces.push({
        x: tList[i],
        y: FList[i],
        error_y: {
          type: 'data', array: FErrList[i],
          visible: true, thickness: 0.8, width: 2
        },
        type: 'scatter', mode: 'markers',
        marker: {
          color: COLORS[i],
          symbol: MARKERS[i],
          size: 6
        },
        opacity: 0.75,
        name: `Data ν = ${NU_LIST_GHZ[i]} GHz`,
        legendgroup: `data_${i}`
      });
    }
  }

  if (showModel) {
    for (let i = 0; i < 3; i++) {
      const nu = NU_LIST_GHZ[i];
      const F = modelFForOneFrequency(tList[i], nu, tRef);
      traces.push({
        x: tList[i],
        y: F,
        type: 'scatter', mode: 'lines',
        line: { color: COLORS[i], width: 2.2 },
        opacity: 0.9,
        name: `Model ν = ${nu} GHz`,
        legendgroup: `model_${i}`
      });
    }
  }

  const layout = {
    title: {
      text: 'ESE Overlay: model vs RATAN data (manual parameters)',
      font: { size: 14 }
    },
    xaxis: {
      title: "Epoch (years)",
      zeroline: false,
      gridcolor: '#e8eef3'
    },
    yaxis: {
      title: "Flux density (Jy)",
      zeroline: false,
      gridcolor: '#e8eef3'
    },
    legend: {
      x: 1, xanchor: 'right', y: 1,
      bgcolor: 'rgba(255,255,255,0.9)',
      font: { size: 11 }
    },
    margin: { l: 70, r: 20, t: 50, b: 60 },
    plot_bgcolor: 'white',
    hovermode: 'closest'
  };

  Plotly.react('plotDiv', traces, layout, {
    responsive: true, displaylogo: false
  });

  const dt = (performance.now() - t0).toFixed(0);
  const nPts = tList.reduce((s, arr) => s + arr.length, 0);

  document.getElementById('status').textContent =
    `✓ Пересчёт: ${dt} ms · точек данных: ${nPts} · кэш: ${eseCache.size} записей`;
  document.getElementById('status').className = 'status';

  const uOff2 = -params.mu_eff * params.t_delay;
  document.getElementById('resolutionHint').textContent =
    `u' бины: ${params.draw_num_bins} · диапазон u': [${params.u_prime_range_min}, ${params.u_prime_range_max}] · ` +
    `u_offset₂ = ${uOff2.toFixed(2)} · пересчёт: ${dt} ms`;
}

// ============================================================
// СЛАЙДЕРЫ
// ============================================================
function makeSlider(containerId, key, label, min, max, step, fmt) {
  const container = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = 'slider-group';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;

  const valEl = document.createElement('span');
  valEl.className = 'val';
  valEl.textContent = fmt(params[key]);
  labelEl.appendChild(valEl);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = min; input.max = max; input.step = step;
  input.value = params[key];
  input.dataset.key = key;

  input.addEventListener('input', e => {
    params[key] = parseFloat(e.target.value);
    valEl.textContent = fmt(params[key]);
    update();
  });

  div.appendChild(labelEl);
  div.appendChild(input);
  container.appendChild(div);
}

function buildSliders() {
  // Форма линз: alpha_ref → sigma_ref → alpha2 → a_ratio2
  makeSlider('gridLenses', 'alpha_ref', 'alpha_ref', 0, 5, 0.01, v => v.toFixed(2));
  makeSlider('gridLenses', 'sigma_ref', 'sigma_ref', 0.3, 5, 0.01, v => v.toFixed(2));
  makeSlider('gridLenses', 'alpha2',    'alpha2',    0, 5, 0.01, v => v.toFixed(2));
  makeSlider('gridLenses', 'a_ratio2',  'a_ratio2',  0.3, 3, 0.01, v => v.toFixed(2));

  // Временная эволюция
  makeSlider('gridTime', 't_min1',  't_min1',  2015.0, 2015.65, 0.0001, v => v.toFixed(4));
  makeSlider('gridTime', 't_delay', 't_delay', 0, 0.6, 0.0001, v => v.toFixed(4));
  makeSlider('gridTime', 'mu_eff',  'mu_eff',  0, 100, 0.1, v => v.toFixed(1));
  makeSlider('gridTime', 'slope',   'slope',   -1, 1, 0.005, v => v.toFixed(3));

  // Нормировки
  makeSlider('gridNorm', 'F0_1', 'F0 (5 GHz)',  0.5, 5, 0.01, v => v.toFixed(2));
  makeSlider('gridNorm', 'F0_2', 'F0 (8 GHz)',  0.5, 5, 0.01, v => v.toFixed(2));
  makeSlider('gridNorm', 'F0_3', 'F0 (11 GHz)', 0.5, 5, 0.01, v => v.toFixed(2));

  // Resolution
  makeSlider('gridResolution', 'u_range_min',       'u_range_min',       -30, 0, 0.5, v => v.toFixed(1));
  makeSlider('gridResolution', 'u_range_max',       'u_range_max',         0, 30, 0.5, v => v.toFixed(1));
  makeSlider('gridResolution', 'u_prime_range_min', "u'_range_min",      -30, 0, 0.5, v => v.toFixed(1));
  makeSlider('gridResolution', 'u_prime_range_max', "u'_range_max",        0, 30, 0.5, v => v.toFixed(1));
  makeSlider('gridResolution', 'draw_num_beta',     'num_beta',          500, 20000, 100, v => v.toFixed(0));
  makeSlider('gridResolution', 'draw_num_u',        'num_u',             100, 2000, 50, v => v.toFixed(0));
  makeSlider('gridResolution', 'draw_num_bins',     'num_bins',           20, 400, 5, v => v.toFixed(0));
}

function resetParams() {
  params = { ...DEFAULTS };
  eseCache.clear();
  document.getElementById('gridLenses').innerHTML = '';
  document.getElementById('gridTime').innerHTML = '';
  document.getElementById('gridNorm').innerHTML = '';
  document.getElementById('gridResolution').innerHTML = '';
  buildSliders();
  update();
}

// ============================================================
// ЗАПУСК
// ============================================================
document.getElementById('showData').addEventListener('change', update);
document.getElementById('showModel').addEventListener('change', update);
document.getElementById('resetBtn').addEventListener('click', resetParams);

buildSliders();

(async () => {
  const statusEl = document.getElementById('status');
  try {
    await loadData();
    statusEl.textContent = '✓ Данные загружены. Идёт первый расчёт…';
    update();
  } catch (err) {
    statusEl.textContent =
      `✗ Ошибка загрузки: ${err.message}. Проверьте, что файлы ` +
      `${FILE_PATHS.join(', ')} лежат рядом с index.html.`;
    statusEl.className = 'status error';
    console.error(err);
  }
})();
</script>
</body>
</html>
