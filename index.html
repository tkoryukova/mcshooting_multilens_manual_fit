<body>
<div class="container">
  <div class="header">
    <h1>🔭 ESE Overlay — RATAN Interactive</h1>
    <p class="subtitle">
      Manual overlay · 2 lenses · α ∝ ν⁻², σ ∝ ν⁻¹ · без фиттинга<br>
      <small>Данные: sig_RATAN5.csv · sig_RATAN8.csv · sig_RATAN11.csv</small>
    </p>
  </div>

  <div id="plotDiv" class="plot-card"></div>

  <div class="controls">
    <h2>Параметры модели</h2>

    <div class="checkbox-row">
      <label>
        <input type="checkbox" id="showData" checked>
        Показывать данные RATAN
      </label>
      <label>
        <input type="checkbox" id="showModel" checked>
        Показывать модель
      </label>
      <button class="btn-reset" id="resetBtn">⟲ Reset к значениям по умолчанию</button>
    </div>

    <h3>Форма линз</h3>
    <div class="grid" id="gridLenses"></div>

    <h3>Временная эволюция</h3>
    <div class="grid" id="gridTime"></div>

    <h3>Нормировки и тренд</h3>
    <div class="grid" id="gridNorm"></div>

    <div class="status" id="status">Загрузка данных…</div>
  </div>
</div>

<script>
// ============================================================
// КОНСТАНТЫ МОДЕЛИ (как в Python)
// ============================================================
const FILE_PATHS = [
  "sig_RATAN5.csv",
  "sig_RATAN8.csv",
  "sig_RATAN11.csv"
];
const NU_LIST_GHZ = [5.0, 8.0, 11.0];
const NU_REF_GHZ = 8.0;

const T_START = 2015.0;
const T_END   = 2015.65;

const COLORS = ['green', 'blue', 'red'];
const MARKERS = ['circle', 'square', 'triangle-up'];

// Значения по умолчанию — из вашего скрипта
const DEFAULTS = {
  alpha_ref: 1.5,
  alpha2:    2.1,
  t_min1:    2015.1987,
  t_delay:   0.3084,
  mu_eff:    35.4115,
  sigma_ref: 2.7,
  slope:    -0.16,
  a_ratio2:  0.6,
  F0_1:      2.58,
  F0_2:      2.19,
  F0_3:      1.97,
  u_range_min: -16,
  u_range_max:  12
};

// Текущие значения (копия DEFAULTS, потом меняются слайдерами)
let params = { ...DEFAULTS };

// Точность (снижаем при перетаскивании — для плавности)
const DRAW_HIGH = { numBeta: 8000, numU: 800, numBins: 80 };
const DRAW_LOW  = { numBeta: 2000, numU: 400, numBins: 80 };
let currentQuality = DRAW_LOW;
let qualityTimer = null;

// ============================================================
// УТИЛИТЫ
// ============================================================
function linspace(a, b, n) {
  const arr = new Array(n);
  if (n === 1) { arr[0] = a; return arr; }
  const step = (b - a) / (n - 1);
  for (let i = 0; i < n; i++) arr[i] = a + i * step;
  return arr;
}

// Детерминированный ГПСЧ (чтобы кривая не «дрожала» между кадрами)
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussian(rng, sigma) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// Линейная интерполяция (аналог np.interp)
function interp(x, xp, fp) {
  if (x <= xp[0]) return fp[0];
  if (x >= xp[xp.length - 1]) return fp[fp.length - 1];
  // Бинарный поиск
  let lo = 0, hi = xp.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (xp[mid] <= x) lo = mid;
    else hi = mid;
  }
  const t = (x - xp[lo]) / (xp[hi] - xp[lo]);
  return fp[lo] * (1 - t) + fp[hi] * t;
}

// ============================================================
// ЯДРО: compute_ese_multi (порт на JS)
// ============================================================
function computeEseMulti(lenses, sigmaSource, uRange, uPrimeRange,
                         numBeta, numU, numBins, seed) {
  const u0 = linspace(uRange[0], uRange[1], numU);
  const rng = mulberry32(seed);
  const betaS = new Float64Array(numBeta);
  for (let k = 0; k < numBeta; k++) betaS[k] = gaussian(rng, sigmaSource);

  const N = numBeta * numU;
  const totalDefl = new Float64Array(N);

  for (const lens of lenses) {
    const alphaI = lens.alpha;
    const uOffI = lens.u_offset;
    const aRatioI = lens.a_ratio || 1.0;
    const alphaEff = alphaI / (aRatioI * aRatioI);
    const gaussI = 1.0 / (aRatioI * aRatioI);

    for (let k = 0; k < numBeta; k++) {
      const off = k * numU;
      for (let i = 0; i < numU; i++) {
        const uShift = u0[i] - uOffI;
        const defI = alphaEff * uShift * Math.exp(-gaussI * uShift * uShift);
        totalDefl[off + i] += defI;
      }
    }
  }

  // Бины
  const bins = linspace(uPrimeRange[0], uPrimeRange[1], numBins + 1);
  const binW = bins[1] - bins[0];
  const histLensed   = new Float64Array(numBins);
  const histUnlensed = new Float64Array(numBins);

  for (let k = 0; k < numBeta; k++) {
    const bS = betaS[k];
    const off = k * numU;
    for (let i = 0; i < numU; i++) {
      const upL = u0[i] + totalDefl[off + i] + bS;
      const upU = u0[i] + bS;

      let idxL = Math.floor((upL - bins[0]) / binW);
      if (idxL >= 0 && idxL < numBins) histLensed[idxL]++;

      let idxU = Math.floor((upU - bins[0]) / binW);
      if (idxU >= 0 && idxU < numBins) histUnlensed[idxU]++;
    }
  }

  const norm = numBeta * numU * binW;
  const binCenters = new Array(numBins);
  const intensity  = new Array(numBins);
  for (let i = 0; i < numBins; i++) {
    binCenters[i] = (bins[i] + bins[i + 1]) / 2;
    const hU = histUnlensed[i] / norm;
    const hL = histLensed[i]   / norm;
    // Как в Python: np.where(hist_unlensed > 0, ..., 0.0)
    intensity[i] = hU > 0 ? hL / hU : 0.0;
  }

  return { binCenters, intensity };
}

// ============================================================
// МОДЕЛЬ: F(t) для одной частоты
// ============================================================
function modelFForOneFrequency(tArray, nuGhz, tRef, useCached) {
  const ratio = nuGhz / NU_REF_GHZ;
  const alphaScale = Math.pow(ratio, -2);
  const sigmaScale = Math.pow(ratio, -1);

  const alpha1Nu = params.alpha_ref * alphaScale;
  const alpha2Nu = params.alpha2 * alphaScale;
  const sigmaNu  = params.sigma_ref * sigmaScale;

  const uOffset1Ref = 0.0;
  const uOffset2Ref = -params.mu_eff * params.t_delay;

  const lensesRef = [
    { alpha: alpha1Nu, u_offset: uOffset1Ref, z: 0.0 },
    { alpha: alpha2Nu, u_offset: uOffset2Ref,
      a_ratio: params.a_ratio2, z: 0.0 }
  ];

  // Ключ кэша зависит только от alpha1Nu, alpha2Nu, sigmaNu, a_ratio2,
  // u_range. При изменении mu_eff/t_min1/slope/F0 — не пересчитываем.
  const cacheKey = [
    alpha1Nu.toFixed(4),
    alpha2Nu.toFixed(4),
    sigmaNu.toFixed(4),
    params.a_ratio2.toFixed(4),
    params.u_range_min.toFixed(2),
    params.u_range_max.toFixed(2),
    currentQuality.numBeta,
    currentQuality.numU,
    currentQuality.numBins
  ].join('|');

  let cached = useCached ? eseCache.get(cacheKey) : null;
  if (!cached) {
    const uRange = [params.u_range_min, params.u_range_max];
    cached = computeEseMulti(
      lensesRef, sigmaNu,
      uRange, uRange,
      currentQuality.numBeta,
      currentQuality.numU,
      currentQuality.numBins,
      42  // seed
    );
    if (useCached) eseCache.set(cacheKey, cached);
  }

  const bc = cached.binCenters;
  const Iref = cached.intensity;

  // u_offset1_t = mu_eff * (t - t_min1)
  const F0 = nuGhz === 5.0 ? params.F0_1
           : nuGhz === 8.0 ? params.F0_2
           : params.F0_3;

  const F = new Array(tArray.length);
  for (let i = 0; i < tArray.length; i++) {
    const uOff1t = params.mu_eff * (tArray[i] - params.t_min1);
    const xInterp = -uOff1t;

    // np.interp требует неубывающий xp. У нас bc уже неубывающий.
    let Iese;
    if (isNaN(Iref[0])) {
      // Если в данных NaN, заменяем на 1.0 построчно (как Python)
      const cleaned = Iref.map(v => isNaN(v) ? 1.0 : v);
      Iese = interp(xInterp, bc, cleaned);
    } else {
      // На случай, если попадутся NaN в середине — сделаем cleaned всегда
      const cleaned = new Array(Iref.length);
      let hasNaN = false;
      for (let k = 0; k < Iref.length; k++) {
        if (isNaN(Iref[k])) { cleaned[k] = 1.0; hasNaN = true; }
        else cleaned[k] = Iref[k];
      }
      Iese = interp(xInterp, bc, cleaned);
    }

    const Itrend = 1.0 + params.slope * (tArray[i] - tRef);
    F[i] = F0 * Iese * Itrend;
  }

  return F;
}

// Кэш результатов Монте-Карло
const eseCache = new Map();

// ============================================================
// ЗАГРУЗКА CSV
// ============================================================
let dataCache = null;   // { t_list, F_list, F_err_list, tRef }

async function loadData() {
  const tList = [], FList = [], FErrList = [];

  for (const path of FILE_PATHS) {
    const text = await (await fetch(path)).text();
    const lines = text.trim().split('\n');
    // Пропускаем заголовок
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(',');
      if (parts.length < 3) continue;
      const epoch = parseFloat(parts[0]);
      const flux  = parseFloat(parts[1]);
      const err   = parseFloat(parts[2]);
      if (isNaN(epoch) || isNaN(flux)) continue;
      if (epoch < T_START || epoch > T_END) continue;
      rows.push({ epoch, flux, err });
    }
    rows.sort((a, b) => a.epoch - b.epoch);
    tList.push(rows.map(r => r.epoch));
    FList.push(rows.map(r => r.flux));
    FErrList.push(rows.map(r => r.err));
  }

  // Общий t_ref
  const allT = tList.flat();
  const tRef = 0.5 * (Math.min(...allT) + Math.max(...allT));

  dataCache = { tList, FList, FErrList, tRef };
  return dataCache;
}

// ============================================================
// ПОСТРОЕНИЕ ГРАФИКА
// ============================================================
function update() {
  if (!dataCache) return;

  const t0 = performance.now();
  const { tList, FList, FErrList, tRef } = dataCache;

  const showData  = document.getElementById('showData').checked;
  const showModel = document.getElementById('showModel').checked;

  const traces = [];

  // ---- Данные ----
  if (showData) {
    for (let i = 0; i < 3; i++) {
      traces.push({
        x: tList[i],
        y: FList[i],
        error_y: {
          type: 'data', array: FErrList[i],
          visible: true, thickness: 0.8, width: 2
        },
        type: 'scatter', mode: 'markers',
        marker: {
          color: COLORS[i],
          symbol: MARKERS[i],
          size: 6
        },
        opacity: 0.75,
        name: `Data ν = ${NU_LIST_GHZ[i]} GHz`,
        legendgroup: `data_${i}`
      });
    }
  }

  // ---- Модель ----
  if (showModel) {
    for (let i = 0; i < 3; i++) {
      const nu = NU_LIST_GHZ[i];
      const F = modelFForOneFrequency(tList[i], nu, tRef, true);
      traces.push({
        x: tList[i],
        y: F,
        type: 'scatter', mode: 'lines',
        line: { color: COLORS[i], width: 2.2 },
        opacity: 0.9,
        name: `Model ν = ${nu} GHz`,
        legendgroup: `model_${i}`
      });
    }
  }

  const layout = {
    title: {
      text: 'ESE Overlay: model vs RATAN data (manual parameters)',
      font: { size: 14 }
    },
    xaxis: {
      title: "Epoch (years)",
      zeroline: false,
      gridcolor: '#e8eef3'
    },
    yaxis: {
      title: "Flux density (Jy)",
      zeroline: false,
      gridcolor: '#e8eef3'
    },
    legend: {
      x: 1, xanchor: 'right', y: 1,
      bgcolor: 'rgba(255,255,255,0.9)',
      font: { size: 11 }
    },
    margin: { l: 70, r: 20, t: 50, b: 60 },
    plot_bgcolor: 'white',
    hovermode: 'closest'
  };

  Plotly.react('plotDiv', traces, layout, {
    responsive: true, displaylogo: false
  });

  const dt = (performance.now() - t0).toFixed(0);
  const nPts = tList.reduce((s, arr) => s + arr.length, 0);
  const q = currentQuality.numBeta === DRAW_HIGH.numBeta ? 'высокое' : 'быстрое';
  document.getElementById('status').textContent =
    `✓ Пересчёт: ${dt} ms · точек данных: ${nPts} · качество: ${q} ` +
    `(${currentQuality.numBeta}×${currentQuality.numU})`;
  document.getElementById('status').className = 'status';
}

// ============================================================
// СЛАЙДЕРЫ
// ============================================================
function makeSlider(containerId, key, label, min, max, step, fmt) {
  const container = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = 'slider-group';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;

  const valEl = document.createElement('span');
  valEl.className = 'val';
  valEl.textContent = fmt(params[key]);
  labelEl.appendChild(valEl);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = min; input.max = max; input.step = step;
  input.value = params[key];

  input.addEventListener('input', e => {
    params[key] = parseFloat(e.target.value);
    valEl.textContent = fmt(params[key]);
    update();

    // После остановки — повышаем качество
    currentQuality = DRAW_LOW;
    if (qualityTimer) clearTimeout(qualityTimer);
    qualityTimer = setTimeout(() => {
      currentQuality = DRAW_HIGH;
      update();
    }, 400);
  });

  div.appendChild(labelEl);
  div.appendChild(input);
  container.appendChild(div);

  return { input, valEl };
}

const sliderRefs = [];

function buildSliders() {
  // ---- Форма линз ----
  sliderRefs.push(makeSlider('gridLenses', 'alpha_ref', 'alpha_ref', 0, 5, 0.01, v => v.toFixed(2)));
  sliderRefs.push(makeSlider('gridLenses', 'alpha2',    'alpha2',    0, 5, 0.01, v => v.toFixed(2)));
  sliderRefs.push(makeSlider('gridLenses', 'a_ratio2',  'a_ratio2',  0.3, 3, 0.01, v => v.toFixed(2)));
  sliderRefs.push(makeSlider('gridLenses', 'sigma_ref', 'sigma_ref', 0.3, 5, 0.01, v => v.toFixed(2)));

  // ---- Временная эволюция ----
  sliderRefs.push(makeSlider('gridTime', 't_min1',  't_min1',  2015.0, 2015.65, 0.0001, v => v.toFixed(4)));
  sliderRefs.push(makeSlider('gridTime', 't_delay', 't_delay', 0, 0.6, 0.0001, v => v.toFixed(4)));
  sliderRefs.push(makeSlider('gridTime', 'mu_eff',  'mu_eff',  0, 100, 0.1, v => v.toFixed(1)));
  sliderRefs.push(makeSlider('gridTime', 'slope',   'slope',   -1, 1, 0.005, v => v.toFixed(3)));

  // ---- Нормировки ----
  sliderRefs.push(makeSlider('gridNorm', 'F0_1', 'F0 (5 GHz)',  0.5, 5, 0.01, v => v.toFixed(2)));
  sliderRefs.push(makeSlider('gridNorm', 'F0_2', 'F0 (8 GHz)',  0.5, 5, 0.01, v => v.toFixed(2)));
  sliderRefs.push(makeSlider('gridNorm', 'F0_3', 'F0 (11 GHz)', 0.5, 5, 0.01, v => v.toFixed(2)));

  // ---- u_range ----
  sliderRefs.push(makeSlider('gridNorm', 'u_range_min', 'u_range_min', -30, 0, 0.5, v => v.toFixed(1)));
  sliderRefs.push(makeSlider('gridNorm', 'u_range_max', 'u_range_max',  0, 30, 0.5, v => v.toFixed(1)));
}

function syncSlidersToParams() {
  // При сбросе — обновляем все input.value
  const allInputs = document.querySelectorAll('.slider-group input[type="range"]');
  // Порядок соответствует buildSliders()
  const keys = [
    'alpha_ref', 'alpha2', 'a_ratio2', 'sigma_ref',
    't_min1', 't_delay', 'mu_eff', 'slope',
    'F0_1', 'F0_2', 'F0_3',
    'u_range_min', 'u_range_max'
  ];
  allInputs.forEach((inp, i) => {
    if (keys[i] && params[keys[i]] !== undefined) {
      inp.value = params[keys[i]];
    }
  });
}

function resetParams() {
  params = { ...DEFAULTS };
  // Обновляем подписи
  sliderRefs.forEach((ref, i) => {
    // Опорядок совпадает с buildSliders
  });
  // Проще: перерисуем панели
  document.getElementById('gridLenses').innerHTML = '';
  document.getElementById('gridTime').innerHTML = '';
  document.getElementById('gridNorm').innerHTML = '';
  sliderRefs.length = 0;
  eseCache.clear();
  buildSliders();
  update();
}

// ============================================================
// ЗАПУСК
// ============================================================
document.getElementById('showData').addEventListener('change', update);
document.getElementById('showModel').addEventListener('change', update);
document.getElementById('resetBtn').addEventListener('click', resetParams);

buildSliders();

// Загрузка данных и первый рендер
(async () => {
  const statusEl = document.getElementById('status');
  try {
    await loadData();
    statusEl.textContent = '✓ Данные загружены. Идёт первый расчёт…';
    currentQuality = DRAW_HIGH;
    update();
  } catch (err) {
    statusEl.textContent =
      `✗ Ошибка загрузки: ${err.message}. Проверьте, что файлы ` +
      `${FILE_PATHS.join(', ')} лежат рядом с index.html.`;
    statusEl.className = 'status error';
    console.error(err);
  }
})();
</script>
</body>
</html>
